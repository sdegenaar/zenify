name: zenify
description: "Complete state management for Flutter — hierarchical dependency injection, intelligent async caching, and offline-first resilience. Zero boilerplate, automatic cleanup."

version: 2.2.2
homepage: https://github.com/sdegenaar/zenify
repository: https://github.com/sdegenaar/zenify
issue_tracker: https://github.com/sdegenaar/zenify/issues
documentation: https://github.com/sdegenaar/zenify/tree/main/doc

topics:
  - state-management
  - dependency-injection
  - reactive-programming
  - offline-first
  - caching

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0