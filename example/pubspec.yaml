name: zenify_example
description: A showcase application and reference demos for Zenify state management.
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  zenify:
    path: ../
  go_router: ^14.8.1
  shared_preferences: ^2.5.4
  connectivity_plus: ^7.0.0
  intl: ^0.20.2
  uuid: ^4.5.2
  cupertino_icons: ^1.0.8
  google_fonts: ^7.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true